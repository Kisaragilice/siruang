services:
  app:
    build: .
    container_name: siruang-app
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - siruang

  db:
    image: mariadb:12.3
    container_name: siruang-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: siruang
      MYSQL_USER: siruang
      MYSQL_PASSWORD: password_siruang
      MYSQL_ROOT_PASSWORD: root_password_siruang
    volumes:
      - siruang_mysql:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "siruang", "-ppassword_siruang"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - siruang

networks:
  siruang:

volumes:
  siruang_mysql:
